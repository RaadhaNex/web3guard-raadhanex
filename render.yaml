services:
  - type: web
    name: web3guard-raadhanex-backend
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RAADHANEX_UPI_ID
        sync: false
      - key: RAADHANEX_UPI_NAME
        value: RAADHANEX
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: none
      - key: AI_SEND_CODE
        value: "false"
