services:
  - type: web
    name: web3guard-static-worker
    env: python
    rootDir: worker_static_analysis
    plan: free
    buildCommand: python -V && python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt && python -m py_compile main.py && python -m pip show semgrep slither-analyzer
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: STATIC_ANALYSIS_ENABLED
        value: "true"
      - key: PROFESSIONAL_WORKER_SERVICE_ROLE
        value: isolated_worker
      - key: PROFESSIONAL_WORKER_ISOLATED_RUNTIME_CONFIRMED
        value: "true"
      - key: PROFESSIONAL_WORKER_ALLOW_LOCAL_EXECUTION
        value: "true"
      - key: PROFESSIONAL_WORKER_NETWORK_ENABLED
        value: "false"
      - key: SLITHER_ENABLED
        value: "true"
      - key: SEMGREP_ENABLED
        value: "true"
      - key: ADERYN_ENABLED
        value: "false"
