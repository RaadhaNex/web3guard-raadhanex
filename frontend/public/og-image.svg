      <stop offset="100%" style="stop-color:#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines subtle -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="88" x2="1200" y2="88"/>
    <line x1="0" y1="176" x2="1200" y2="176"/>
    <line x1="0" y1="264" x2="1200" y2="264"/>
    <line x1="0" y1="352" x2="1200" y2="352"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="528" x2="1200" y2="528"/>
    <line x1="88" y1="0" x2="88" y2="630"/>
    <line x1="264" y1="0" x2="264" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="616" y1="0" x2="616" y2="630"/>
    <line x1="792" y1="0" x2="792" y2="630"/>
    <line x1="968" y1="0" x2="968" y2="630"/>
