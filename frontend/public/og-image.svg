  <rect x="80" y="510" width="130" height="36" rx="18" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="145" y="533" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle">From ₹999</text>
  <rect x="228" y="510" width="120" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="288" y="533" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">Hindi support</text>
  <rect x="366" y="510" width="110" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="421" y="533" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">UPI accepted</text>
  <rect x="494" y="510" width="130" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="559" y="533" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">37 security rules</text>
