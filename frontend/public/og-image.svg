  <!-- Score card -->
  <rect x="860" y="200" width="260" height="320" rx="20" fill="rgba(15,23,42,0.9)" stroke="rgba(34,211,238,0.25)" stroke-width="1.5"/>
  <text x="980" y="250" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">SAMPLE SCAN OUTPUT</text>
  <text x="980" y="330" font-family="system-ui,sans-serif" font-size="80" font-weight="900" fill="#f8fafc" text-anchor="middle">76</text>
  <text x="980" y="370" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#f59e0b" text-anchor="middle">Medium Risk</text>
  <rect x="895" y="395" width="80" height="26" rx="13" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="935" y="413" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">2 Critical</text>
  <rect x="985" y="395" width="70" height="26" rx="13" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
  <text x="1020" y="413" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fdba74" text-anchor="middle">3 High</text>
  <rect x="895" y="432" width="165" height="26" rx="13" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="977" y="450" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">Fix before launch</text>
